<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kata All-In Tournament</title>
    <link href="../public/css/professional-design.css" rel="stylesheet">
</head>
<body>
    <div class="app-header">
        <div class="row">
            <div class="col">
                <h1>🏆 Kata All-In Tournament</h1>
            </div>
            <div class="col text-right">
                <div class="controls">
                    <button class="btn-pro btn-primary" onclick="openDisplay()">📺 Display</button>
                    <button class="btn-pro btn-success" id="judgeBtn" onclick="toggleWebJudge()">👨⚖️ Start Judge Server</button>
                    <button class="btn-pro" onclick="goBack()">← Back</button>
                </div>
            </div>
        </div>
    </div>

    <div class="main-content fade-in">
        <div class="card">
            <div class="card-header">
                <h3>形 (Kata) All-In Tournament Setup</h3>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label>Tournament Name:</label>
                    <input type="text" id="tournamentName" class="form-control" placeholder="e.g., Regional Kata Championship">
                </div>
                <div class="form-group">
                    <label>Category:</label>
                    <input type="text" id="category" class="form-control" placeholder="e.g., Senior Male Kata">
                </div>
                <div class="form-group">
                    <label>Number of Judges:</label>
                    <select id="judgeCount" class="form-control">
                        <option value="3">3 Judges</option>
                        <option value="5">5 Judges</option>
                        <option value="7">7 Judges</option>
                    </select>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h3>Competitors</h3>
            </div>
            <div class="card-body">
                <div class="competitor-list" id="competitorList">
                    <!-- Competitors will be added here -->
                </div>
                <div class="row mt-3">
                    <div class="col">
                        <input type="text" id="newCompetitorName" class="form-control" placeholder="Competitor Name">
                    </div>
                    <div class="col">
                        <input type="text" id="newCompetitorClub" class="form-control" placeholder="Club">
                    </div>
                    <div class="col">
                        <button class="btn-pro btn-success" onclick="addCompetitor()">➕ Add Competitor</button>
                    </div>
                </div>
                <div class="text-center mt-4">
                    <button class="btn-pro btn-success btn-lg" onclick="startTournament()">🏆 Start Tournament</button>
                    <button class="btn-pro btn-danger" onclick="resetTournament()">リセット (Reset)</button>
                </div>
            </div>
        </div>

        <div id="tournamentBracket" class="card" style="display: none;">
            <div class="card-body">
                <h2>Tournament Bracket</h2>
                <div class="round-info">
                    <h3 id="currentRoundTitle">Round 1</h3>
                    <p id="roundDescription">All competitors perform</p>
                </div>
                
                <div class="current-performer">
                    <h3>Current Performer</h3>
                    <div id="performerInfo">
                        <span id="performerName">Select performer</span>
                        <button class="btn-pro btn-success" onclick="startPerformance()">▶️ Start</button>
                        <button class="btn-pro btn-primary" onclick="endPerformance()">⏹️ End</button>
                    </div>
                </div>

                <div class="competitors-grid" id="competitorsGrid">
                    <!-- Current round competitors -->
                </div>

                <div class="text-center mt-4">
                    <button class="btn-pro btn-success" onclick="finishRound()">✅ Finish Round</button>
                    <button class="btn-pro btn-primary" onclick="showResults()">📊 Show Results</button>
                </div>
            </div>
        </div>
    </div>

    <script src="kata-allin.js"></script>
    <script>
        function openDisplay() {
            const { ipcRenderer } = require('electron');
            ipcRenderer.send('open-display-window');
        }
        
        let judgeServerRunning = false;
        
        function toggleWebJudge() {
            const { ipcRenderer, shell } = require('electron');
            const os = require('os');
            const btn = document.getElementById('judgeBtn');
            
            if (!judgeServerRunning) {
                ipcRenderer.send('start-web-judge');
                
                // Get local IP and open browser
                const networkInterfaces = os.networkInterfaces();
                let localIP = 'localhost';
                Object.keys(networkInterfaces).forEach(key => {
                    networkInterfaces[key].forEach(addr => {
                        if (addr.family === 'IPv4' && !addr.internal) {
                            localIP = addr.address;
                        }
                    });
                });
                
                setTimeout(() => {
                    shell.openExternal(`http://${localIP}:12121/judge`);
                }, 1000);
                
                btn.textContent = '🛑 Stop Judge Server';
                btn.className = 'btn-pro btn-danger';
                judgeServerRunning = true;
            } else {
                ipcRenderer.send('stop-web-judge');
                btn.textContent = '👨⚖️ Start Judge Server';
                btn.className = 'btn-pro btn-success';
                judgeServerRunning = false;
            }
        }
        
        function goBack() {
            const { ipcRenderer } = require('electron');
            ipcRenderer.send('close-display-window');
            window.location.href = 'main.html';
        }
    </script>
    <script src="notifications.js"></script>
</body>
</html>
