<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H Karate</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0078d4, #005a9e);
            color: white;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        
        .splash-container {
            text-align: center;
            animation: fadeIn 1s ease-in;
        }
        
        .logo {
            font-size: 72px;
            font-weight: 900;
            margin-bottom: 20px;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        .subtitle {
            font-size: 24px;
            margin-bottom: 40px;
            opacity: 0.9;
        }
        
        .author {
            font-size: 18px;
            opacity: 0.8;
            margin-top: 40px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="logo">🥋 H KARATE</div>
        <div class="subtitle">Professional Karate Scoring System</div>
        <div class="author">Made by Hosam Sheboun</div>
    </div>
    
    <script>
        setTimeout(() => {
            window.location.href = 'main.html';
        }, 3000);
    </script>
</body>
</html>
