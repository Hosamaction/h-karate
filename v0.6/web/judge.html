<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>H Karate — Judge Panel</title>
  <style>
    :root {
      --bg:      #0a0c12;
      --surface: #111420;
      --card:    #181c2a;
      --border:  rgba(255,255,255,0.08);
      --accent:  #6366f1;
      --green:   #22c55e;
      --red:     #ef4444;
      --gold:    #f59e0b;
      --text:    #f1f5f9;
      --muted:   #64748b;
      --radius:  12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

    .shell { display: flex; flex-direction: column; min-height: 100vh; max-width: 480px; margin: 0 auto; padding: 16px; gap: 14px; }

    .header { text-align: center; padding: 12px 0; }
    .header .logo { font-size: 1.4rem; font-weight: 900; }
    .header .logo span { color: var(--accent); }
    .header .judge-id { font-size: 0.8rem; color: var(--muted); margin-top: 4px; letter-spacing: 0.1em; text-transform: uppercase; }

    .status-bar { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.85rem; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .dot.on  { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .dot.act { background: var(--gold);  box-shadow: 0 0 6px var(--gold); animation: blink 1.2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .performer-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; text-align: center; display: none; }
    .performer-card.show { display: block; }
    .perf-label { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    .perf-name  { font-size: 1.6rem; font-weight: 900; margin-bottom: 2px; }
    .perf-club  { font-size: 0.85rem; color: var(--muted); }

    .scoring-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; display: none; }
    .scoring-card.show { display: block; }

    .score-row { margin-bottom: 20px; }
    .score-label { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; display: flex; justify-content: space-between; }
    .score-label .range { color: var(--accent); }
    .score-control { display: flex; align-items: center; gap: 10px; }
    .score-control input { flex: 1; background: #0f1220; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 1.6rem; font-weight: 700; text-align: center; padding: 12px; font-family: 'Courier New', monospace; outline: none; }
    .score-control input:focus { border-color: var(--accent); }
    .adj-btn { width: 48px; height: 48px; border-radius: 8px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--text); font-size: 1.4rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.15s; flex-shrink: 0; }
    .adj-btn:hover { background: rgba(255,255,255,0.1); }
    .adj-btn:active { transform: scale(0.92); }

    .total-row { background: rgba(99,102,241,0.08); border: 1px solid rgba(99,102,241,0.2); border-radius: 10px; padding: 16px; text-align: center; margin-bottom: 20px; }
    .total-label { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .total-val   { font-size: 3rem; font-weight: 900; color: var(--accent); font-family: 'Courier New', monospace; }

    .quick-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 20px; }
    .quick-btn { padding: 10px 6px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.78rem; font-weight: 600; cursor: pointer; text-align: center; transition: 0.15s; }
    .quick-btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.15); }

    .submit-btn { width: 100%; padding: 16px; background: var(--green); border: none; border-radius: 10px; color: #fff; font-size: 1.1rem; font-weight: 800; cursor: pointer; letter-spacing: 0.02em; transition: 0.15s; }
    .submit-btn:hover { background: #16a34a; }
    .submit-btn:active { transform: scale(0.98); }
    .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .clear-btn { width: 100%; padding: 10px; background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font-size: 0.85rem; cursor: pointer; margin-top: 8px; transition: 0.15s; }
    .clear-btn:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }

    .submitted-msg { text-align: center; padding: 20px; background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.2); border-radius: var(--radius); color: var(--green); font-weight: 700; display: none; }
    .submitted-msg.show { display: block; }

    .waiting-msg { text-align: center; padding: 32px 20px; color: var(--muted); font-size: 0.9rem; }
    .waiting-msg .icon { font-size: 3rem; margin-bottom: 12px; }

    .toast-area { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 999; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
    .toast-pill { background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 8px 20px; font-size: 0.85rem; font-weight: 600; opacity: 0; transform: translateY(10px); transition: 0.3s; pointer-events: none; }
    .toast-pill.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <div class="shell">
    <div class="header">
      <div class="logo">🥋 H <span>KARATE</span></div>
      <div class="judge-id" id="judgeId">Connecting...</div>
    </div>

    <div class="status-bar">
      <div class="dot" id="connDot"></div>
      <span id="connStatus">Connecting to server...</span>
    </div>

    <div class="performer-card" id="performerCard">
      <div class="perf-label">Now Performing</div>
      <div class="perf-name" id="perfName">—</div>
      <div class="perf-club" id="perfClub">—</div>
    </div>

    <div class="scoring-card" id="scoringCard">
      <div class="score-row">
        <div class="score-label">Technical Score <span class="range">0.0 – 7.0</span></div>
        <div class="score-control">
          <button class="adj-btn" onclick="adj('tech',-0.1)">−</button>
          <input type="number" id="techInput" min="0" max="7" step="0.1" value="0.0" oninput="calcTotal()">
          <button class="adj-btn" onclick="adj('tech',0.1)">+</button>
        </div>
      </div>

      <div class="score-row">
        <div class="score-label">Athletic Score <span class="range">0.0 – 3.0</span></div>
        <div class="score-control">
          <button class="adj-btn" onclick="adj('ath',-0.1)">−</button>
          <input type="number" id="athInput" min="0" max="3" step="0.1" value="0.0" oninput="calcTotal()">
          <button class="adj-btn" onclick="adj('ath',0.1)">+</button>
        </div>
      </div>

      <div class="total-row">
        <div class="total-label">Total Score</div>
        <div class="total-val" id="totalVal">0.0</div>
      </div>

      <div class="quick-row">
        <button class="quick-btn" onclick="quick(4.0,1.5)">Fair<br>5.5</button>
        <button class="quick-btn" onclick="quick(5.0,2.0)">Good<br>7.0</button>
        <button class="quick-btn" onclick="quick(6.0,2.5)">Great<br>8.5</button>
        <button class="quick-btn" onclick="quick(6.5,2.5)">Exc.<br>9.0</button>
        <button class="quick-btn" onclick="quick(7.0,2.5)">Super<br>9.5</button>
        <button class="quick-btn" onclick="quick(7.0,3.0)">Max<br>10.0</button>
      </div>

      <button class="submit-btn" id="submitBtn" onclick="submitScore()">✓ Submit Score</button>
      <button class="clear-btn" onclick="clearScore()">Clear</button>
    </div>

    <div class="submitted-msg" id="submittedMsg">
      ✅ Score Submitted Successfully
    </div>

    <div class="waiting-msg" id="waitingMsg">
      <div class="icon">⏳</div>
      Waiting for performance to start...
    </div>
  </div>

  <div class="toast-area" id="toastArea"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let judgeNumber = 0;
    let currentPerformer = null;
    let scores = { technical:0, athletic:0, total:0 };
    let submitted = false;

    socket.on('connect', () => {
      document.getElementById('connDot').className = 'dot on';
      document.getElementById('connStatus').textContent = 'Connected';
    });

    socket.on('disconnect', () => {
      document.getElementById('connDot').className = 'dot';
      document.getElementById('connStatus').textContent = 'Disconnected — reconnecting...';
    });

    socket.on('assigned', (data) => {
      judgeNumber = data.judgeNumber;
      document.getElementById('judgeId').textContent = `Judge ${judgeNumber}`;
    });

    socket.on('state:sync', (state) => {
      if (state.match) handleMatchStart(state.match);
    });

    socket.on('match:started', (data) => handleMatchStart(data));

    socket.on('kata:performance-started', (data) => {
      currentPerformer = data.performer?.name || data.performer || 'Competitor';
      submitted = false;
      document.getElementById('perfName').textContent = typeof data.performer === 'object' ? (data.performer.name || '—') : String(data.performer || '—');
      document.getElementById('perfClub').textContent = typeof data.performer === 'object' ? (data.performer.club || '') : '';
      document.getElementById('performerCard').classList.add('show');
      document.getElementById('scoringCard').classList.add('show');
      document.getElementById('waitingMsg').style.display = 'none';
      document.getElementById('submittedMsg').classList.remove('show');
      document.getElementById('connDot').className = 'dot act';
      document.getElementById('connStatus').textContent = 'Performance in progress';
      clearScore();
      toast('Performance started — score now!', 'var(--gold)');
    });

    socket.on('match:ended', () => {
      currentPerformer = null;
      document.getElementById('performerCard').classList.remove('show');
      document.getElementById('scoringCard').classList.remove('show');
      document.getElementById('waitingMsg').style.display = 'block';
      document.getElementById('connDot').className = 'dot on';
      document.getElementById('connStatus').textContent = 'Match ended — waiting for next';
    });

    function handleMatchStart(data) {
      document.getElementById('connDot').className = 'dot on';
      document.getElementById('connStatus').textContent = `${(data.discipline||'').toUpperCase()} match active`;
      document.getElementById('waitingMsg').style.display = 'block';
    }

    function adj(type, amount) {
      const id = type === 'tech' ? 'techInput' : 'athInput';
      const max = type === 'tech' ? 7 : 3;
      const input = document.getElementById(id);
      let val = parseFloat(input.value) + amount;
      val = Math.max(0, Math.min(max, Math.round(val * 10) / 10));
      input.value = val.toFixed(1);
      calcTotal();
    }

    function calcTotal() {
      const t = parseFloat(document.getElementById('techInput').value) || 0;
      const a = parseFloat(document.getElementById('athInput').value) || 0;
      const total = Math.round((t + a) * 10) / 10;
      document.getElementById('totalVal').textContent = total.toFixed(1);
      scores = { technical: t, athletic: a, total };
    }

    function quick(tech, ath) {
      document.getElementById('techInput').value = tech.toFixed(1);
      document.getElementById('athInput').value  = ath.toFixed(1);
      calcTotal();
    }

    function submitScore() {
      if (!currentPerformer) { toast('No active performance', 'var(--red)'); return; }
      if (submitted) { toast('Already submitted', 'var(--gold)'); return; }
      socket.emit('judge:score', {
        judgeNumber,
        performer: currentPerformer,
        technical: scores.technical,
        athletic:  scores.athletic,
        total:     scores.total
      });
      submitted = true;
      document.getElementById('submittedMsg').classList.add('show');
      document.getElementById('connDot').className = 'dot on';
      document.getElementById('connStatus').textContent = `Score submitted: ${scores.total.toFixed(1)}`;
      toast(`Score ${scores.total.toFixed(1)} submitted ✓`, 'var(--green)');
    }

    function clearScore() {
      document.getElementById('techInput').value = '0.0';
      document.getElementById('athInput').value  = '0.0';
      document.getElementById('totalVal').textContent = '0.0';
      scores = { technical:0, athletic:0, total:0 };
      submitted = false;
      document.getElementById('submittedMsg').classList.remove('show');
    }

    function toast(msg, color) {
      const area = document.getElementById('toastArea');
      const pill = document.createElement('div');
      pill.className = 'toast-pill';
      pill.style.color = color || 'var(--text)';
      pill.textContent = msg;
      area.appendChild(pill);
      requestAnimationFrame(() => requestAnimationFrame(() => pill.classList.add('show')));
      setTimeout(() => { pill.classList.remove('show'); setTimeout(() => pill.remove(), 400); }, 3000);
    }
  </script>
</body>
</html>
