<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H Karate — OBS Overlay</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: transparent; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; }

    #overlay { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%); display: none; }

    /* ── Kumite bar ── */
    .kumite-bar {
      display: flex; align-items: center; gap: 0;
      background: rgba(10,12,20,0.88); border-radius: 12px;
      overflow: hidden; border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(12px); min-width: 560px;
    }
    .corner { padding: 12px 20px; display: flex; flex-direction: column; align-items: center; min-width: 180px; }
    .corner.red  { background: rgba(239,68,68,0.18); }
    .corner.blue { background: rgba(59,130,246,0.18); }
    .c-name  { font-size: 1rem; font-weight: 800; color: #fff; white-space: nowrap; max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
    .c-club  { font-size: 0.7rem; color: rgba(255,255,255,0.5); margin-top: 2px; }
    .c-score { font-family: 'Courier New', monospace; font-size: 2.4rem; font-weight: 900; line-height: 1; margin-top: 4px; }
    .corner.red  .c-score { color: #ef4444; }
    .corner.blue .c-score { color: #3b82f6; }
    .center-info { padding: 10px 16px; display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
    .timer-obs { font-family: 'Courier New', monospace; font-size: 1.6rem; font-weight: 900; color: #fff; }
    .timer-obs.low { color: #ef4444; }
    .round-obs { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.45); }
    .vs-obs { font-size: 0.8rem; font-weight: 900; color: rgba(255,255,255,0.3); }

    /* ── Kata bar ── */
    .kata-bar {
      display: flex; align-items: center; gap: 0;
      background: rgba(10,12,20,0.88); border-radius: 12px;
      overflow: hidden; border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(12px); min-width: 480px;
    }
    .kata-corner { padding: 12px 20px; display: flex; flex-direction: column; align-items: center; min-width: 160px; }
    .kata-corner.red  { background: rgba(239,68,68,0.18); }
    .kata-corner.blue { background: rgba(59,130,246,0.18); }
    .kata-score { font-family: 'Courier New', monospace; font-size: 2rem; font-weight: 900; line-height: 1; margin-top: 4px; }
    .kata-corner.red  .kata-score { color: #ef4444; }
    .kata-corner.blue .kata-score { color: #3b82f6; }
    .kata-center { padding: 10px 16px; display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
    .kata-label { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.45); }
    .performing-obs { font-size: 0.75rem; font-weight: 700; color: #f59e0b; }

    /* ── Winner banner ── */
    .winner-banner {
      background: linear-gradient(135deg, rgba(245,158,11,0.25), rgba(10,12,20,0.9));
      border: 1px solid rgba(245,158,11,0.4); border-radius: 12px;
      padding: 16px 32px; text-align: center;
      backdrop-filter: blur(12px);
    }
    .winner-label { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: #f59e0b; margin-bottom: 4px; }
    .winner-name  { font-size: 1.6rem; font-weight: 900; color: #fff; }
    .winner-method{ font-size: 0.75rem; color: rgba(255,255,255,0.5); margin-top: 4px; }
  </style>
</head>
<body>
  <div id="overlay"></div>

  <script>
    const socket = io();
    const overlay = document.getElementById('overlay');

    let state = null;

    socket.on('obs:update', (s) => { state = s; render(); });
    socket.on('state:sync',  (s) => { state = s; render(); });
    socket.on('match:ended', (d) => { showWinner(d); });

    function fmt(s) {
      s = Math.max(0, s || 0);
      return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
    }

    function render() {
      if (!state || !state.match) { overlay.style.display = 'none'; return; }
      overlay.style.display = 'block';
      const m = state.match;
      const disc = state.discipline || m.discipline;

      if (disc === 'kumite') renderKumite(m);
      else if (disc === 'kata') renderKata(m);
    }

    function renderKumite(m) {
      const t = state.timer || {};
      const timeVal = fmt(t.time);
      const low = (t.time || 0) <= 30;
      overlay.innerHTML = `
        <div class="kumite-bar">
          <div class="corner red">
            <div class="c-name">${esc(m.red?.name || '—')}</div>
            <div class="c-club">${esc(m.red?.club || '')}</div>
            <div class="c-score">${m.red?.score ?? 0}</div>
          </div>
          <div class="center-info">
            <div class="round-obs">${esc(m.round || '')}</div>
            <div class="timer-obs${low?' low':''}">${timeVal}</div>
            <div class="vs-obs">VS</div>
          </div>
          <div class="corner blue">
            <div class="c-name">${esc(m.blue?.name || '—')}</div>
            <div class="c-club">${esc(m.blue?.club || '')}</div>
            <div class="c-score">${m.blue?.score ?? 0}</div>
          </div>
        </div>`;
    }

    function renderKata(m) {
      const performer = m.currentPerformer;
      overlay.innerHTML = `
        <div class="kata-bar">
          <div class="kata-corner red">
            <div class="c-name">${esc(m.red?.name || '—')}</div>
            <div class="c-club">${esc(m.red?.club || '')}</div>
            <div class="kata-score">${(m.red?.total || 0).toFixed(2)}</div>
          </div>
          <div class="kata-center">
            <div class="kata-label">Kata 1v1</div>
            ${performer ? `<div class="performing-obs">⚡ ${esc(m[performer]?.name || '')}</div>` : ''}
          </div>
          <div class="kata-corner blue">
            <div class="c-name">${esc(m.blue?.name || '—')}</div>
            <div class="c-club">${esc(m.blue?.club || '')}</div>
            <div class="kata-score">${(m.blue?.total || 0).toFixed(2)}</div>
          </div>
        </div>`;
    }

    function showWinner(data) {
      overlay.style.display = 'block';
      overlay.innerHTML = `
        <div class="winner-banner">
          <div class="winner-label">🏆 Winner</div>
          <div class="winner-name">${esc(data.winnerName || data.winner || '—')}</div>
          <div class="winner-method">${esc(data.method || '')}</div>
        </div>`;
      setTimeout(() => { overlay.style.display = 'none'; }, 8000);
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>
</body>
</html>
