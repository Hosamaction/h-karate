<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H Karate</title>
  <link rel="stylesheet" href="../css/theme.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 40%, #1a1040 0%, #0a0c12 70%);
      overflow: hidden;
    }

    .splash {
      text-align: center;
      animation: fadeIn 0.8s ease forwards;
    }

    .splash-emblem {
      font-size: 6rem;
      line-height: 1;
      margin-bottom: 24px;
      filter: drop-shadow(0 0 40px rgba(99,102,241,0.6));
      animation: scaleIn 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }

    .splash-title {
      font-size: 3.5rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: #fff;
      margin-bottom: 8px;
    }

    .splash-title span { color: var(--accent); }

    .splash-sub {
      font-size: 1rem;
      color: var(--text-secondary);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 48px;
    }

    .splash-bar {
      width: 200px;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      margin: 0 auto;
      overflow: hidden;
    }

    .splash-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--purple));
      border-radius: 2px;
      animation: load 2.2s ease forwards;
    }

    .splash-author {
      margin-top: 32px;
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 0.1em;
    }

    @keyframes load { from { width: 0; } to { width: 100%; } }
  </style>
</head>
<body>
  <div class="splash">
    <div class="splash-emblem">🥋</div>
    <div class="splash-title">H <span>KARATE</span></div>
    <div class="splash-sub" data-i18n="splash_subtitle">Professional Tournament Scoring System — v0.6</div>
    <div class="splash-bar"><div class="splash-bar-fill"></div></div>
    <div class="splash-author" data-i18n="splash_author">by Hosam Sheboun</div>
  </div>
  <script src="../js/i18n.js"></script>
  <script>
    I18N.init();
    setTimeout(() => { window.location.href = 'home.html'; }, 2500);
  </script>
</body>
</html>
