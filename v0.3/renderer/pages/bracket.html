<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H Karate — Bracket</title>
  <link rel="stylesheet" href="../css/theme.css">
  <style>
    .bracket-builder { display: grid; grid-template-columns: 320px 1fr; gap: 24px; align-items: start; }

    .bracket-wrap { overflow-x: auto; padding: 20px 0; }
    .bracket-rounds { display: flex; gap: 0; align-items: stretch; min-height: 400px; }

    .bracket-round { display: flex; flex-direction: column; justify-content: space-around; min-width: 200px; padding: 0 12px; position: relative; }
    .bracket-round-title { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); text-align: center; margin-bottom: 16px; }

    .bracket-match { display: flex; flex-direction: column; gap: 2px; margin: 8px 0; position: relative; }
    .bracket-match::after { content:''; position: absolute; right: -12px; top: 50%; width: 12px; height: 1px; background: var(--border); }
    .bracket-match:last-child::after { display: none; }

    .bracket-slot {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 170px;
      transition: var(--transition);
    }
    .bracket-slot.winner { border-color: var(--gold); background: var(--gold-dim); }
    .bracket-slot.tbd    { color: var(--text-muted); font-style: italic; }
    .bracket-slot .slot-name  { font-weight: 600; flex: 1; }
    .bracket-slot .slot-score { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; font-weight: 700; color: var(--green); }

    .connector { width: 12px; background: transparent; position: relative; }
    .connector::before { content:''; position: absolute; left: 0; top: 25%; bottom: 25%; border-left: 1px solid var(--border); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); border-radius: 0 4px 4px 0; width: 12px; }

    .setup-card .comp-input-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .setup-card .comp-input-row input { flex: 1; }

    .bracket-type-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn { padding: 8px 16px; border-radius: var(--radius-md); font-size: 0.85rem; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); transition: var(--transition); }
    .tab-btn.active { background: var(--accent-dim); color: var(--accent); border-color: rgba(99,102,241,0.4); }

    .print-bracket-btn { margin-top: 12px; }

    #emptyBracket { text-align: center; padding: 60px; color: var(--text-muted); }
    #emptyBracket .icon { font-size: 4rem; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <a class="logo" href="home.html">🥋 H <span>KARATE</span></a>
      <nav class="header-nav">
        <a href="home.html" data-i18n="nav_home">Home</a>
        <a href="kumite.html" data-i18n="nav_kumite">Kumite</a>
        <a href="kata.html" data-i18n="nav_kata">Kata 1v1</a>
        <a href="kata-allin.html" data-i18n="nav_kataAllin">Kata All-In</a>
        <a href="bracket.html" class="active" data-i18n="nav_bracket">Bracket</a>
        <a href="history.html" data-i18n="nav_history">History</a>
        <a href="settings.html" data-i18n="nav_settings">Settings</a>
      </nav>
      <div class="header-actions">
        <button class="btn btn-ghost btn-sm" onclick="printBracket()" data-i18n="btn_print">🖨 Print</button>
        <button class="btn btn-ghost btn-sm" onclick="window.location.href='home.html'" data-i18n="btn_back">← Back</button>
      </div>
    </header>

    <main class="page-content wide">
      <div class="flex-between mb-24">
        <div><h2 data-i18n="bracket_title">🏆 Tournament Bracket</h2><p class="text-sm text-muted" data-i18n="bracket_subtitle">Build and visualize elimination brackets</p></div>
      </div>

      <div class="bracket-builder">
        <!-- Setup panel -->
        <div>
          <div class="card setup-card mb-16">
            <div class="card-header"><h3 data-i18n="bracket_setup">Bracket Setup</h3></div>
            <div class="card-body">
              <div class="form-group mb-12">
                <label data-i18n="bracket_tourName">Tournament Name</label>
                <input type="text" id="bracketName" placeholder="e.g. Regional Championship">
              </div>
              <div class="form-group mb-16">
                <label data-i18n="bracket_type">Bracket Type</label>
                <div class="bracket-type-tabs">
                  <button class="tab-btn active" onclick="setType('single',this)" data-i18n="bracket_singleElim">Single Elim.</button>
                  <button class="tab-btn" onclick="setType('round-robin',this)" data-i18n="bracket_roundRobin">Round Robin</button>
                </div>
              </div>
              <div class="form-group mb-12">
                <label data-i18n="allin_addComp">Add Competitor</label>
                <div class="comp-input-row">
                  <input type="text" id="newCompName" placeholder="Name">
                  <input type="text" id="newCompClub" placeholder="Club">
                </div>
                <button class="btn btn-green w-full btn-sm" onclick="addComp()" data-i18n="bracket_addBtn">➕ Add</button>
              </div>
              <div id="compSetupList" style="display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto;margin-top:8px"></div>
            </div>
            <div class="card-footer">
              <button class="btn btn-primary w-full" onclick="generateBracket()" data-i18n="bracket_generate">⚡ Generate Bracket</button>
            </div>
          </div>

          <div class="card">
            <div class="card-header"><h3 data-i18n="bracket_enterResults">Enter Results</h3></div>
            <div class="card-body">
              <p class="text-sm text-muted mb-16" data-i18n="bracket_clickSlot">Click a match slot in the bracket to mark the winner</p>
              <div id="resultControls" class="hidden">
                <div class="form-group mb-12">
                  <label data-i18n="bracket_selMatch">Selected Match</label>
                  <div id="selectedMatchInfo" class="text-sm" style="padding:10px;background:var(--bg-input);border-radius:var(--radius-md);color:var(--text-primary)">—</div>
                </div>
                <div style="display:flex;flex-direction:column;gap:8px">
                  <button class="btn btn-red"  id="winBtn1" onclick="setWinner(0)">—</button>
                  <button class="btn btn-blue" id="winBtn2" onclick="setWinner(1)">—</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Bracket display -->
        <div class="card">
          <div class="card-header">
            <h3 id="bracketTitle">Bracket</h3>
            <button class="btn btn-ghost btn-sm print-bracket-btn" onclick="printBracket()">🖨 Print</button>
          </div>
          <div class="card-body">
            <div id="emptyBracket">
              <div class="icon">🏆</div>
              <div>Add competitors and click Generate Bracket</div>
            </div>
            <div class="bracket-wrap hidden" id="bracketWrap">
              <div class="bracket-rounds" id="bracketRounds"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/toast.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/i18n.js"></script>
  <script>
    let competitors = [];
    let bracketType = 'single';
    let rounds = [];
    let selectedMatch = null;

    function setType(t, btn) {
      bracketType = t;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function addComp() {
      const name = Utils.getVal('newCompName');
      const club = Utils.getVal('newCompClub');
      if (!name) { Toast.error('Missing', 'Enter competitor name'); return; }
      competitors.push({ id: Date.now(), name, club, seed: competitors.length + 1 });
      Utils.setVal('newCompName', ''); Utils.setVal('newCompClub', '');
      renderSetupList();
    }

    function renderSetupList() {
      const list = document.getElementById('compSetupList');
      list.innerHTML = '';
      competitors.forEach((c, i) => {
        const row = document.createElement('div');
        row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:6px 10px;background:rgba(255,255,255,0.03);border-radius:6px;font-size:0.85rem';
        const seed = document.createElement('span');
        seed.style.cssText = 'font-family:monospace;color:var(--text-muted);width:20px';
        seed.textContent = i + 1;
        const info = document.createElement('span');
        info.style.flex = '1';
        info.textContent = c.name + (c.club ? ` (${c.club})` : '');
        const del = document.createElement('button');
        del.className = 'btn btn-danger btn-sm';
        del.style.padding = '3px 8px';
        del.textContent = '✕';
        del.onclick = () => { competitors = competitors.filter(x => x.id !== c.id); renderSetupList(); };
        row.appendChild(seed); row.appendChild(info); row.appendChild(del);
        list.appendChild(row);
      });
    }

    function generateBracket() {
      if (competitors.length < 2) { Toast.error('Not Enough', 'Add at least 2 competitors'); return; }
      const name = Utils.getVal('bracketName') || 'Tournament';
      Utils.setText('bracketTitle', name);

      if (bracketType === 'single') generateSingleElim();
      else generateRoundRobin();

      document.getElementById('emptyBracket').classList.add('hidden');
      document.getElementById('bracketWrap').classList.remove('hidden');
      Toast.success('Bracket Generated', `${competitors.length} competitors`);
    }

    function generateSingleElim() {
      // Pad to next power of 2
      const n = Math.pow(2, Math.ceil(Math.log2(competitors.length)));
      const seeded = [...competitors];
      while (seeded.length < n) seeded.push(null); // byes

      rounds = [];
      // Round 1 matches
      const r1 = [];
      for (let i = 0; i < n; i += 2) {
        r1.push({ p1: seeded[i], p2: seeded[i+1], winner: null });
      }
      rounds.push({ name: 'Round 1', matches: r1 });

      // Subsequent rounds
      let prev = r1;
      while (prev.length > 1) {
        const next = [];
        for (let i = 0; i < prev.length; i += 2) {
          next.push({ p1: null, p2: null, winner: null, src: [prev[i], prev[i+1]] });
        }
        const rName = next.length === 1 ? 'Final' : next.length === 2 ? 'Semi Final' : next.length === 4 ? 'Quarter Final' : `Round of ${next.length * 2}`;
        rounds.push({ name: rName, matches: next });
        prev = next;
      }

      renderBracket();
    }

    function generateRoundRobin() {
      // Simple round-robin: everyone vs everyone
      rounds = [{ name: 'Round Robin', matches: [] }];
      for (let i = 0; i < competitors.length; i++) {
        for (let j = i + 1; j < competitors.length; j++) {
          rounds[0].matches.push({ p1: competitors[i], p2: competitors[j], winner: null });
        }
      }
      renderBracket();
    }

    function renderBracket() {
      const container = document.getElementById('bracketRounds');
      container.innerHTML = '';

      rounds.forEach((round, ri) => {
        const col = document.createElement('div');
        col.className = 'bracket-round';

        const title = document.createElement('div');
        title.className = 'bracket-round-title';
        title.textContent = round.name;
        col.appendChild(title);

        round.matches.forEach((match, mi) => {
          const matchEl = document.createElement('div');
          matchEl.className = 'bracket-match';

          [0, 1].forEach(pi => {
            const player = pi === 0 ? match.p1 : match.p2;
            const slot = document.createElement('div');
            slot.className = 'bracket-slot' + (!player ? ' tbd' : '') + (match.winner === pi ? ' winner' : '');
            slot.dataset.round = ri;
            slot.dataset.match = mi;
            slot.dataset.player = pi;

            const nameEl = document.createElement('span');
            nameEl.className = 'slot-name';
            nameEl.textContent = player ? player.name : 'TBD';

            const scoreEl = document.createElement('span');
            scoreEl.className = 'slot-score';
            scoreEl.textContent = match.winner === pi ? '✓' : '';

            slot.appendChild(nameEl);
            slot.appendChild(scoreEl);
            slot.addEventListener('click', () => selectMatchSlot(ri, mi, match));
            matchEl.appendChild(slot);
          });

          col.appendChild(matchEl);
        });

        container.appendChild(col);

        // Connector between rounds
        if (ri < rounds.length - 1) {
          const conn = document.createElement('div');
          conn.className = 'connector';
          container.appendChild(conn);
        }
      });
    }

    function selectMatchSlot(ri, mi, match) {
      selectedMatch = { ri, mi, match };
      const p1 = match.p1?.name || 'TBD';
      const p2 = match.p2?.name || 'TBD';
      document.getElementById('selectedMatchInfo').textContent = `${p1} vs ${p2}`;
      document.getElementById('winBtn1').textContent = `🏆 ${p1} Wins`;
      document.getElementById('winBtn2').textContent = `🏆 ${p2} Wins`;
      Utils.show('resultControls');
    }

    function setWinner(playerIdx) {
      if (!selectedMatch) return;
      const { ri, mi, match } = selectedMatch;
      match.winner = playerIdx;
      const winner = playerIdx === 0 ? match.p1 : match.p2;

      // Propagate winner to next round
      if (ri + 1 < rounds.length) {
        const nextMatchIdx = Math.floor(mi / 2);
        const nextPlayerIdx = mi % 2;
        const nextMatch = rounds[ri + 1].matches[nextMatchIdx];
        if (nextMatch) {
          if (nextPlayerIdx === 0) nextMatch.p1 = winner;
          else nextMatch.p2 = winner;
        }
      }

      renderBracket();
      Utils.hide('resultControls');
      selectedMatch = null;
      if (ri === rounds.length - 1) {
        Toast.success('🏆 Champion!', `${winner?.name || 'TBD'} wins the tournament!`);
      }
    }

    function printBracket() {
      const name = Utils.getVal('bracketName') || 'Tournament Bracket';
      let html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${name}</title>
      <style>
        body { font-family: Arial, sans-serif; padding: 32px; }
        h1 { font-size: 24px; margin-bottom: 4px; }
        .sub { color: #666; margin-bottom: 24px; font-size: 14px; }
        .rounds { display: flex; gap: 24px; align-items: flex-start; }
        .round { min-width: 160px; }
        .round-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #666; margin-bottom: 12px; text-align: center; }
        .match { margin-bottom: 16px; }
        .slot { border: 1px solid #ddd; border-radius: 4px; padding: 8px 12px; font-size: 13px; margin-bottom: 2px; display: flex; justify-content: space-between; }
        .slot.winner { background: #f0fdf4; border-color: #16a34a; font-weight: 700; }
        .slot.tbd { color: #999; font-style: italic; }
        .footer { margin-top: 32px; font-size: 11px; color: #999; }
      </style></head><body>
      <h1>🥋 ${name}</h1>
      <div class="sub">Generated by H Karate Scoring System v3 · ${new Date().toLocaleString()}</div>
      <div class="rounds">`;

      rounds.forEach(round => {
        html += `<div class="round"><div class="round-title">${round.name}</div>`;
        round.matches.forEach(match => {
          html += `<div class="match">`;
          [0,1].forEach(pi => {
            const p = pi === 0 ? match.p1 : match.p2;
            const cls = !p ? 'tbd' : match.winner === pi ? 'winner' : '';
            html += `<div class="slot ${cls}"><span>${p ? p.name : 'TBD'}</span><span>${match.winner === pi ? '✓' : ''}</span></div>`;
          });
          html += `</div>`;
        });
        html += `</div>`;
      });

      html += `</div><div class="footer">H Karate v3 Red Belt</div></body></html>`;
      window.api.send('print:results', html);
    }

    I18N.init();
  </script>
</body>
</html>
